name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site-with-pages.yml@main
    with:
      deploy_path: ${{ vars.DEPLOY_PATH }}
      rsync_excludes: |
        README.md
        LICENSE.md
        openaec-website.jsx
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}

name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_HOST: 167.235.54.105
  DEPLOY_PORT: "22"
  DEPLOY_USER: root
  DEPLOY_PATH: /var/www/open-aec.com

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage website files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='LICENSE.md' \
            --exclude='openaec-website.jsx' \
            ./ "$RUNNER_TEMP/site/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: ${{ runner.temp }}/site

  deploy-pages:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-nginx:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ${{ runner.temp }}/site

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to nginx host
        run: |
          rsync -avz --delete \
            -e "ssh -p $DEPLOY_PORT" \
            "$RUNNER_TEMP/site/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

name: Update Statistics & News

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v5
        with:
          # A PAT (secret WORKFLOW_PAT) from a user allowed to push to `main`
          # lets us commit directly (main is protected against the default bot).
          # Falls back to GITHUB_TOKEN if the secret is absent.
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-stats.js

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-release-notes.js

      - name: Generate downloads stats (+ daily snapshot)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-downloads.js

      - name: Compute download trends (weekly deltas)
        run: node scripts/compute-download-trends.js

      - name: Update homepage tool stats (static)
        run: node scripts/build-homepage-stats.js

      - name: Build /api/tools.json machine-readable catalog
        run: node scripts/build-tools-api.js

      - name: Cleanup old history (keep 90 days)
        run: |
          find data/history -name "*.json" -mtime +90 -delete 2>/dev/null || true

      - name: Commit updated data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html api/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update statistics & news $(date +%Y-%m-%d)"
          git push origin HEAD:main

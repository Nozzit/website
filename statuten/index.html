    </div>
  </footer>

  <script>
    // Simple markdown to HTML renderer for the statuten
    fetch('oprichtingsakte.md')
      .then(r => r.text())
      .then(md => {
        const html = md
          .replace(/^# (.+)$/gm, '<h1>$1</h1>')
          .replace(/^## (.+)$/gm, '<h2>$1</h2>')
          .replace(/^### (.+)$/gm, '<h3>$1</h3>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/^---$/gm, '')
          .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
          .replace(/^   ([a-z])\. (.+)$/gm, '<li>$2</li>')
          .replace(/\n\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        document.getElementById('docContent').innerHTML = '<p>' + html + '</p>';
      })
      .catch(() => {
        document.getElementById('docContent').innerHTML = '<p>Het document kon niet geladen worden. <a href="oprichtingsakte.md">Download het markdown bestand</a>.</p>';
      });
  </script>
  <script src="/shared/i18n.js?v=20260603"></script>
